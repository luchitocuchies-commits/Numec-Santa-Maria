<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NUMEC CONTROL CALDERA</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
    font-family:Arial;
    background:#111;
    color:white;
    margin:0;
    padding:20px;
}

h1{
    text-align:center;
    color:#00d4ff;
}

.card{
    background:#1e1e1e;
    padding:15px;
    border-radius:10px;
    margin-bottom:15px;
}

.estado-on{
    color:#00ff66;
    font-weight:bold;
}

.estado-off{
    color:#ff4444;
    font-weight:bold;
}

.online{
    color:#00ff66;
    font-weight:bold;
}

.offline{
    color:#ff4444;
    font-weight:bold;
}

button{
    padding:10px 15px;
    border:none;
    border-radius:8px;
    margin:5px;
    cursor:pointer;
    font-size:16px;
}

.btn-on{
    background:#00aa55;
    color:white;
}

.btn-off{
    background:#cc3333;
    color:white;
}

.btn-graf{
    background:#333;
    color:white;
}

input{
    padding:8px;
    border-radius:6px;
    border:none;
    width:90px;
}

select{
    padding:8px;
    border-radius:6px;
}

canvas{
    background:#fff;
    border-radius:10px;
}

</style>

</head>

<body>

<h1>🔥 NUMEC CONTROL CALDERA</h1>

<!-- ================================================= -->
<!-- TEMPERATURA -->
<!-- ================================================= -->

<div class="card">

<h2>
🌡 Temperatura Interior:
<span id="temp">0</span> °C
</h2>

<h2>
🌤 Santiago Centro:
<span id="tempExterior">--</span> °C
</h2>

<h3>
Estado:
<span id="estado" class="estado-off">
OFF
</span>
</h3>

<p>
Motivo:
<span id="motivo">
---
</span>
</p>

</div>

<!-- ================================================= -->
<!-- RF -->
<!-- ================================================= -->

<div class="card">

<h3>📡 Comunicación</h3>

<p>
RF:
<span id="rf_estado">
---
</span>
</p>

</div>

<!-- ================================================= -->
<!-- COUNTDOWN -->
<!-- ================================================= -->

<div class="card">

<h3>⏳ Countdown</h3>

<p>
Encendido:
<span id="countdown_on">0</span>
</p>

<p>
Apagado:
<span id="countdown_off">0</span>
</p>

</div>

<!-- ================================================= -->
<!-- MODO -->
<!-- ================================================= -->

<div class="card">

<h3>Modo funcionamiento</h3>

<select id="modo">

<option value="AUTO">
AUTO
</option>

<option value="MANUAL">
MANUAL
</option>

</select>

<br><br>

<button
class="btn-on"
onclick="manualOn()">

Manual ON

</button>

<button
class="btn-off"
onclick="manualOff()">

Manual OFF

</button>

</div>

<!-- ================================================= -->
<!-- SETPOINT -->
<!-- ================================================= -->

<div class="card">

<h3>🌡 Setpoints</h3>

<label>
Encender bajo
</label>

<input type="number" id="set_on">

<label>
Apagar sobre
</label>

<input type="number" id="set_off">

<br><br>

<button onclick="guardarSetpoints()">

Guardar Setpoints

</button>

</div>

<!-- ================================================= -->
<!-- HORARIO -->
<!-- ================================================= -->

<div class="card">

<h3>🕒 Horario</h3>

<label>
Hora inicio
</label>

<input type="time" id="hora_inicio">

<label>
Hora fin
</label>

<input type="time" id="hora_fin">

<br><br>

<label>

<input type="checkbox" id="modo24">

Modo 24/7

</label>

<br><br>

<button onclick="guardarHorario()">

Guardar Horario

</button>

</div>

<!-- ================================================= -->
<!-- HISTÉRESIS -->
<!-- ================================================= -->

<div class="card">

<h3>⏱ Histéresis</h3>

<label>
Min ON
</label>

<input type="number" id="min_on">

<label>
Min OFF
</label>

<input type="number" id="min_off">

<br><br>

<button onclick="guardarHisterisis()">

Guardar Histéresis

</button>

</div>

<!-- ================================================= -->
<!-- GRAFICO -->
<!-- ================================================= -->

<div class="card">

<h2>📈 Historial Temperatura</h2>

<button class="btn-graf" onclick="cargarGrafico(3)">
3 Horas
</button>

<button class="btn-graf" onclick="cargarGrafico(6)">
6 Horas
</button>

<button class="btn-graf" onclick="cargarGrafico(12)">
12 Horas
</button>

<button class="btn-graf" onclick="cargarGrafico(24)">
24 Horas
</button>

<button class="btn-graf" onclick="cargarGrafico(168)">
Semanal
</button>

<button class="btn-graf" onclick="cargarGrafico(720)">
Mensual
</button>

<br><br>

<canvas id="graficoTemp"></canvas>

</div>

<script type="module">

// =====================================================
// FIREBASE
// =====================================================

import { initializeApp }

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {

getDatabase,
ref,
set,
onValue,
get

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

// =====================================================
// CONFIG
// =====================================================

const firebaseConfig = {

apiKey:
"AIzaSyC2Le7c9aShxgX62qLPIXG65yOys7gvuq4",

authDomain:
"mantenimiento-numec.firebaseapp.com",

databaseURL:
"https://mantenimiento-numec-default-rtdb.firebaseio.com",

projectId:
"mantenimiento-numec"

};

// =====================================================

const app =
initializeApp(firebaseConfig);

const db =
getDatabase(app);

// =====================================================
// WATCHDOG
// =====================================================

let ultimoHeartbeat = Date.now();

// =====================================================
// GRAFICO
// =====================================================

let chart;

// =====================================================
// TEMPERATURA EXTERIOR
// =====================================================

async function actualizarTemperaturaExterior(){

try{

const response = await fetch(
'https://api.open-meteo.com/v1/forecast?latitude=-33.45&longitude=-70.66&current=temperature_2m'
);

const data = await response.json();

document.getElementById("tempExterior")
.innerText =
data.current.temperature_2m;

}

catch(error){

document.getElementById("tempExterior")
.innerText = "--";

}

}

// =====================================================
// ACTUALIZAR CADA 10 MIN
// =====================================================

actualizarTemperaturaExterior();

setInterval(
actualizarTemperaturaExterior,
600000
);

// =====================================================
// CALDERA
// =====================================================

onValue(
ref(db, "/caldera"),
(snapshot)=>{

const data = snapshot.val();

if(!data) return;

// TEMP

document.getElementById("temp").innerText =
data.temp ?? 0;

// ESTADO

document.getElementById("estado").innerText =
data.estado ?? "OFF";

if(data.estado=="ON"){

document.getElementById("estado")
.className="estado-on";
}

else{

document.getElementById("estado")
.className="estado-off";
}

// MOTIVO

document.getElementById("motivo").innerText =
data.motivo ?? "---";

// RF

if(data.rf_online){

document.getElementById("rf_estado")
.innerHTML =
'<span class="online">🟢 ONLINE</span>';
}

else{

document.getElementById("rf_estado")
.innerHTML =
'<span class="offline">🔴 EMISOR OFFLINE</span>';
}

// COUNTDOWN

document.getElementById("countdown_on").innerText =
data.countdown_on ?? 0;

document.getElementById("countdown_off").innerText =
data.countdown_off ?? 0;

// MODO

document.getElementById("modo").value =
data.modo ?? "AUTO";

// SETPOINTS

document.getElementById("set_on").value =
data.set_on ?? 20;

document.getElementById("set_off").value =
data.set_off ?? 26;

});

// =====================================================
// HEARTBEAT RECEPTOR
// =====================================================

onValue(
ref(db, "/caldera/receptor_heartbeat"),
(snapshot)=>{

if(snapshot.exists()){

ultimoHeartbeat = Date.now();

}

});

// =====================================================
// WATCHDOG RECEPTOR
// =====================================================

setInterval(()=>{

let diff =
Date.now() - ultimoHeartbeat;

if(diff > 15000){

document.getElementById("rf_estado")
.innerHTML =
'<span class="offline">🔴 RECEPTOR OFFLINE</span>';

document.getElementById("temp")
.innerText = -127;

document.getElementById("estado")
.innerText = "OFF";

document.getElementById("estado")
.className = "estado-off";

document.getElementById("motivo")
.innerText = "RECEPTOR OFFLINE";

}

},1000);

// =====================================================
// HORARIO
// =====================================================

onValue(
ref(db, "/caldera/horario"),
(snapshot)=>{

const data = snapshot.val();

if(!data) return;

document.getElementById("hora_inicio").value =
data.inicio ?? "06:00";

document.getElementById("hora_fin").value =
data.fin ?? "23:00";

document.getElementById("modo24").checked =
data.modo24 ?? true;

});

// =====================================================
// HISTÉRESIS
// =====================================================

onValue(
ref(db, "/caldera/tiempos"),
(snapshot)=>{

const data = snapshot.val();

if(!data) return;

document.getElementById("min_on").value =
data.min_on ?? 1;

document.getElementById("min_off").value =
data.min_off ?? 1;

});

// =====================================================
// GRAFICO
// =====================================================

window.cargarGrafico = async function(horas){

const snapshot = await get(
ref(db, "/historial/temp")
);

if(!snapshot.exists()) return;

const datos = snapshot.val();

let labels = [];
let temperaturas = [];

const ahora = new Date();

Object.entries(datos).forEach(([fecha, valor])=>{

let year = fecha.substring(0,4);
let month = fecha.substring(4,6);
let day = fecha.substring(6,8);

let hour = fecha.substring(9,11);
let minute = fecha.substring(11,13);
let second = fecha.substring(13,15);

let fechaObj =
new Date(
`${year}-${month}-${day}T${hour}:${minute}:${second}`
);

let diffHoras =
(ahora - fechaObj) / 3600000;

if(diffHoras <= horas){

labels.push(
`${day}/${month} ${hour}:${minute}`
);

temperaturas.push(valor);

}

});

const ctx =
document.getElementById("graficoTemp");

if(chart){

chart.destroy();

}

chart = new Chart(ctx, {

type:'line',

data:{

labels:labels,

datasets:[{

label:'Temperatura °C',

data:temperaturas,

borderWidth:2,

tension:0.2

}]

},

options:{

responsive:true,

plugins:{

legend:{
display:true
}

},

scales:{

y:{

beginAtZero:true,

min:0,

title:{
display:true,
text:'Temperatura °C'
}

},

x:{

title:{
display:true,
text:'Tiempo'
}

}

}

}

});

}

// =====================================================
// GRAFICO INICIAL
// =====================================================

cargarGrafico(3);

// =====================================================
// CAMBIO MODO
// =====================================================

document
.getElementById("modo")
.addEventListener("change",(e)=>{

set(
ref(db,"/caldera/modo"),
e.target.value
);

});

// =====================================================
// MANUAL
// =====================================================

window.manualOn = function(){

set(
ref(db,"/caldera/manual_relay"),
true
);

}

window.manualOff = function(){

set(
ref(db,"/caldera/manual_relay"),
false
);

}

// =====================================================
// SETPOINTS
// =====================================================

window.guardarSetpoints = function(){

set(
ref(db,"/caldera/set_on"),
Number(
document.getElementById("set_on").value
)
);

set(
ref(db,"/caldera/set_off"),
Number(
document.getElementById("set_off").value
)
);

alert("Setpoints guardados");

}

// =====================================================
// HORARIO
// =====================================================

window.guardarHorario = function(){

set(
ref(db,"/caldera/horario/inicio"),
document.getElementById("hora_inicio").value
);

set(
ref(db,"/caldera/horario/fin"),
document.getElementById("hora_fin").value
);

set(
ref(db,"/caldera/horario/modo24"),
document.getElementById("modo24").checked
);

alert("Horario guardado");

}

// =====================================================
// HISTÉRESIS
// =====================================================

window.guardarHisterisis = function(){

set(
ref(db,"/caldera/tiempos/min_on"),
Number(
document.getElementById("min_on").value
)
);

set(
ref(db,"/caldera/tiempos/min_off"),
Number(
document.getElementById("min_off").value
)
);

alert("Histéresis guardada");

}

</script>

</body>
</html>
