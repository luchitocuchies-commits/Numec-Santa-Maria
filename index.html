<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>NUMEC Monitor</title>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body { background:#0f172a; color:white; font-family:Arial; text-align:center; }
.card { background:#1e293b; padding:20px; margin:15px auto; border-radius:15px; width:90%; max-width:1000px; }
.temp { font-size:60px; color:#38bdf8; }
.estado { font-weight:bold; }
.online { color:#22c55e; }
.offline { color:red; }
button { margin:5px; padding:10px; border:none; border-radius:8px; background:#38bdf8; cursor:pointer; }
</style>
</head>

<body>

<div class="card">
  <h1>NUMEC</h1>
  <h2>Torre A - Estanque 1</h2>

  <div class="temp" id="temp">--</div>
  <p id="hora"></p>
  <div id="estado" class="estado offline">DESCONECTADO</div>
</div>

<div class="card">
  <button onclick="modoTiempoReal()">Tiempo real</button>
  <button onclick="cargarHoras(3)">3h</button>
  <button onclick="cargarHoras(6)">6h</button>
  <button onclick="cargarHoras(12)">12h</button>
  <button onclick="cargarHoras(24)">24h</button>

  <canvas id="grafico"></canvas>
</div>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyAcHuJpGOra7VEiwhRCEg7Ka8ECiIb0Tg8",
  databaseURL: "https://mantenimiento-numec-default-rtdb.firebaseio.com"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const basePath = "numec/santa_maria/temperatura";

let grafico;
let realtimeInterval;
let labels = [];
let data = [];
let ultimoTimestamp = 0;

// 🔥 DATOS EN VIVO
db.ref(basePath + "/actual").on("value", snap => {

  const d = snap.val();

  if(d){

    document.getElementById("temp").innerText =
      d.valor.toFixed(1) + " °C";

    document.getElementById("hora").innerText =
      new Date().toLocaleString();

    ultimoTimestamp = d.timestamp * 1000;

    document.getElementById("estado").innerText = "ONLINE";
    document.getElementById("estado").className = "estado online";
  }
});

// 🔥 DESCONECTADO
setInterval(() => {

  if(!ultimoTimestamp || Date.now() - ultimoTimestamp > 60000){

    document.getElementById("estado").innerText = "DESCONECTADO";
    document.getElementById("estado").className = "estado offline";
    document.getElementById("temp").innerText = "DESCONECTADO";
  }

}, 5000);

// 🔥 GRAFICO
function graficar(l,d,t){
  if(grafico) grafico.destroy();

  grafico = new Chart(document.getElementById("grafico"),{
    type:'line',
    data:{ labels:l, datasets:[{label:t,data:d}] },
    options:{ animation:false }
  });
}

// 🔥 TIEMPO REAL CON HISTÓRICO
async function modoTiempoReal(){

  clearInterval(realtimeInterval);

  const snap = await db.ref(basePath+"/registros").limitToLast(50).once("value");
  const hist = snap.val();

  labels=[];
  data=[];

  if(hist){
    Object.keys(hist).forEach(k=>{
      labels.push(new Date(k*1000).toLocaleTimeString());
      data.push(hist[k]);
    });
  }

  graficar(labels,data,"Tiempo real");

  realtimeInterval=setInterval(()=>{

    db.ref(basePath+"/actual").once("value", snap=>{

      const d=snap.val();
      if(!d) return;

      labels.push(new Date().toLocaleTimeString());
      data.push(d.valor);

      if(labels.length>50){
        labels.shift();
        data.shift();
      }

      graficar(labels,data,"Tiempo real");

    });

  },5000);
}

// 🔥 HISTÓRICO
async function cargarHoras(h){

  clearInterval(realtimeInterval);

  const snap = await db.ref(basePath+"/registros").once("value");
  const hist = snap.val();

  if(!hist) return;

  const ahora = Math.floor(Date.now()/1000);
  const limite = ahora - h*3600;

  let l=[], d=[];

  Object.keys(hist).forEach(k=>{
    if(Number(k)>=limite){
      l.push(new Date(k*1000).toLocaleTimeString());
      d.push(hist[k]);
    }
  });

  graficar(l,d,"Últimas "+h+"h");
}

modoTiempoReal();

</script>

</body>
</html>
