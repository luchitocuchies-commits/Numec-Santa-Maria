<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>NUMEC Monitor</title>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<style>
body {
  background:#0f172a;
  color:white;
  font-family:Arial;
  text-align:center;
}

.temp {
  font-size:60px;
  color:#38bdf8;
}

.online { color:#22c55e; }
.offline { color:red; }
</style>
</head>

<body>

<h1>NUMEC</h1>
<h2>Torre A - Estanque 1</h2>

<div class="temp" id="temp">--</div>
<div id="estado" class="offline">DESCONECTADO</div>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyAcHuJpGOra7VEiwhRCEg7Ka8ECiIb0Tg8",
  databaseURL: "https://mantenimiento-numec-default-rtdb.firebaseio.com"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let ultimoTimestamp = 0;

// 🔥 LECTURA
db.ref("numec/santa_maria/temperatura/actual").on("value", snap => {

  const d = snap.val();

  if(d){

    document.getElementById("temp").innerText =
      d.valor.toFixed(1) + " °C";

    ultimoTimestamp = d.timestamp * 1000;

    document.getElementById("estado").innerText = "ONLINE";
    document.getElementById("estado").className = "online";
  }
});

// 🔥 DETECCIÓN REAL
setInterval(() => {

  if(!ultimoTimestamp || (Date.now() - ultimoTimestamp > 60000)){

    document.getElementById("estado").innerText = "DESCONECTADO";
    document.getElementById("estado").className = "offline";

    document.getElementById("temp").innerText = "DESCONECTADO";
  }

}, 5000);

</script>

</body>
</html>
