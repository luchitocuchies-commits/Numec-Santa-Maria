<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>NUMEC Monitor</title>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
  background:#0f172a;
  color:white;
  font-family:Arial;
  text-align:center;
}

.card {
  background:#1e293b;
  padding:20px;
  margin:15px auto;
  border-radius:15px;
  width:90%;
  max-width:1000px;
}

.temp {
  font-size:60px;
  color:#38bdf8;
}

.estado { font-weight:bold; }
.online { color:#22c55e; }
.offline { color:red; }

.ambiente {
  font-size:18px;
  color:#facc15;
}

.alerta {
  color:red;
  font-weight:bold;
}

button {
  margin:5px;
  padding:10px;
  border:none;
  border-radius:8px;
  background:#38bdf8;
  cursor:pointer;
}

button:hover {
  background:#0ea5e9;
}

canvas {
  margin-top:20px;
}
</style>
</head>

<body>

<div class="card">
  <h1>NUMEC</h1>
  <h2>Torre A - Estanque 1</h2>

  <div class="temp" id="temp">-- °C</div>
  <p id="hora">...</p>

  <div id="estado" class="estado offline">OFFLINE</div>
  <div id="tendencia"></div>

  <div class="ambiente" id="tempAmbiente">Ambiente Santiago: -- °C</div>

  <div id="alertaTemp" class="alerta"></div>
  <div id="alertaEnergia" class="alerta"></div>
</div>

<div class="card">
  <h3>Gráficos</h3>

  <button onclick="modoTiempoReal()">Tiempo real</button>
  <button onclick="cargarHoras(6)">Últimas 6 horas</button>
  <button onclick="cargarHoras(12)">Últimas 12 horas</button>
  <button onclick="cargarDia()">Diario</button>
  <button onclick="cargarSemana()">Semanal</button>
  <button onclick="cargarMes()">Mensual</button>
  <button onclick="cargarAnio()">Anual</button>
  <button onclick="exportarCSV()">Exportar CSV</button>

  <canvas id="grafico"></canvas>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAcHuJpGOra7VEiwhRCEg7Ka8ECiIb0Tg8",
  databaseURL: "https://mantenimiento-numec-default-rtdb.firebaseio.com"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const basePath = "numec/santa_maria/temperatura";

let grafico;
let realtimeInterval;
let realtimeLabels = [];
let realtimeData = [];
let ultimoDataset = [];

let ultimoUpdate = Date.now();
let ultimaTemp = null;

// Temperatura actual
db.ref(basePath + "/actual").on("value", snap => {
  const d = snap.val();

  if(d){
    const valor = d.valor ?? d;

    document.getElementById("temp").innerText = Number(valor).toFixed(1) + " °C";
    document.getElementById("hora").innerText = new Date().toLocaleString();

    ultimoUpdate = Date.now();

    document.getElementById("estado").innerText = "ONLINE";
    document.getElementById("estado").className = "estado online";

    if(ultimaTemp !== null){
      if(valor > ultimaTemp){
        document.getElementById("tendencia").innerText = "↑ Subiendo";
      } else if(valor < ultimaTemp){
        document.getElementById("tendencia").innerText = "↓ Bajando";
      } else {
        document.getElementById("tendencia").innerText = "→ Estable";
      }
    }

    ultimaTemp = valor;

    if(valor < 35){
      document.getElementById("alertaTemp").innerText = "⚠️ BAJA TEMPERATURA";
    } else {
      document.getElementById("alertaTemp").innerText = "";
    }
  }
});

// Corte energía / pérdida comunicación
setInterval(() => {
  if(Date.now() - ultimoUpdate > 120000){
    document.getElementById("estado").innerText = "OFFLINE";
    document.getElementById("estado").className = "estado offline";
    document.getElementById("alertaEnergia").innerText = "⚡ POSIBLE CORTE O PÉRDIDA DE COMUNICACIÓN";
  } else {
    document.getElementById("alertaEnergia").innerText = "";
  }
}, 5000);

// Temperatura ambiente Santiago
function cargarClima(){
  fetch("https://api.open-meteo.com/v1/forecast?latitude=-33.45&longitude=-70.66&current_weather=true")
  .then(r => r.json())
  .then(d => {
    document.getElementById("tempAmbiente").innerText =
      "Ambiente Santiago: " + d.current_weather.temperature + " °C";
  })
  .catch(() => {
    document.getElementById("tempAmbiente").innerText =
      "Ambiente Santiago: sin datos";
  });
}

cargarClima();
setInterval(cargarClima, 600000);

// Crear gráfico
function graficar(labels, data, titulo){

  const ctx = document.getElementById("grafico");

  if(grafico) grafico.destroy();

  grafico = new Chart(ctx,{
    type:'line',
    data:{
      labels:labels,
      datasets:[{
        label:titulo,
        data:data,
        borderWidth:2,
        tension:0.25,
        pointRadius:2
      }]
    },
    options:{
      animation:false,
      responsive:true,
      scales:{
        y:{
          title:{display:true,text:"Temperatura °C"}
        },
        x:{
          title:{display:true,text:"Tiempo"}
        }
      }
    }
  });

  ultimoDataset = labels.map((l,i)=>({x:l,y:data[i]}));
}

// Tiempo real cada 5 segundos
function modoTiempoReal(){

  clearInterval(realtimeInterval);

  realtimeLabels = [];
  realtimeData = [];

  realtimeInterval = setInterval(() => {

    db.ref(basePath + "/actual").once("value", snap => {
      const d = snap.val();
      if(!d) return;

      const valor = d.valor ?? d;

      realtimeLabels.push(new Date().toLocaleTimeString());
      realtimeData.push(Number(valor));

      if(realtimeLabels.length > 60){
        realtimeLabels.shift();
        realtimeData.shift();
      }

      graficar(realtimeLabels, realtimeData, "Tiempo real cada 5 segundos");
    });

  }, 5000);
}

// Leer registros históricos, compatible con fechas y epoch
async function obtenerRegistros(){
  const snap = await db.ref(basePath + "/registros_minuto").once("value");
  const data = snap.val();

  let registros = [];

  if(!data) return registros;

  Object.keys(data).forEach(k1 => {
    const nivel1 = data[k1];

    if(typeof nivel1 === "number"){
      registros.push({
        epoch: Number(k1),
        temp: nivel1
      });
    } else if(typeof nivel1 === "object"){
      Object.keys(nivel1).forEach(k2 => {
        const valor = nivel1[k2];

        if(typeof valor === "number"){
          registros.push({
            epoch: Number(k2),
            temp: valor
          });
        } else if(typeof valor === "object"){
          registros.push({
            epoch: Number(valor.epoch ?? k2),
            temp: Number(valor.temperatura ?? valor.valor)
          });
        }
      });
    }
  });

  registros = registros
    .filter(r => !isNaN(r.epoch) && !isNaN(r.temp))
    .sort((a,b) => a.epoch - b.epoch);

  return registros;
}

// Últimas 6 o 12 horas
async function cargarHoras(horas){

  clearInterval(realtimeInterval);

  const registros = await obtenerRegistros();

  if(registros.length === 0){
    alert("Sin datos históricos");
    return;
  }

  const ahora = Math.floor(Date.now() / 1000);
  const limite = ahora - horas * 3600;

  const filtrados = registros.filter(r => r.epoch >= limite);

  if(filtrados.length === 0){
    alert("Sin datos en las últimas " + horas + " horas");
    return;
  }

  let labels = [];
  let vals = [];

  filtrados.forEach(r => {
    labels.push(new Date(r.epoch * 1000).toLocaleTimeString());
    vals.push(r.temp);
  });

  graficar(labels, vals, "Últimas " + horas + " horas");
}

// Diario
async function cargarDia(){

  clearInterval(realtimeInterval);

  const registros = await obtenerRegistros();

  const ahora = Math.floor(Date.now() / 1000);
  const limite = ahora - 24 * 3600;

  const filtrados = registros.filter(r => r.epoch >= limite);

  if(filtrados.length === 0){
    alert("Sin datos diarios");
    return;
  }

  let labels = [];
  let vals = [];

  filtrados.forEach(r => {
    labels.push(new Date(r.epoch * 1000).toLocaleTimeString());
    vals.push(r.temp);
  });

  graficar(labels, vals, "Últimas 24 horas");
}

// Semanal
async function cargarSemana(){

  clearInterval(realtimeInterval);

  const registros = await obtenerRegistros();

  const ahora = Math.floor(Date.now() / 1000);
  const limite = ahora - 7 * 24 * 3600;

  const filtrados = registros.filter(r => r.epoch >= limite);

  if(filtrados.length === 0){
    alert("Sin datos semanales");
    return;
  }

  const porDia = {};

  filtrados.forEach(r => {
    const dia = new Date(r.epoch * 1000).toISOString().slice(0,10);
    if(!porDia[dia]) porDia[dia] = [];
    porDia[dia].push(r.temp);
  });

  let labels = [];
  let vals = [];

  Object.keys(porDia).sort().forEach(dia => {
    const arr = porDia[dia];
    const prom = arr.reduce((a,b)=>a+b,0) / arr.length;
    labels.push(dia);
    vals.push(prom);
  });

  graficar(labels, vals, "Promedio últimos 7 días");
}

// Mensual
async function cargarMes(){

  clearInterval(realtimeInterval);

  const registros = await obtenerRegistros();

  const ahora = Math.floor(Date.now() / 1000);
  const limite = ahora - 30 * 24 * 3600;

  const filtrados = registros.filter(r => r.epoch >= limite);

  if(filtrados.length === 0){
    alert("Sin datos mensuales");
    return;
  }

  const porDia = {};

  filtrados.forEach(r => {
    const dia = new Date(r.epoch * 1000).toISOString().slice(0,10);
    if(!porDia[dia]) porDia[dia] = [];
    porDia[dia].push(r.temp);
  });

  let labels = [];
  let vals = [];

  Object.keys(porDia).sort().forEach(dia => {
    const arr = porDia[dia];
    const prom = arr.reduce((a,b)=>a+b,0) / arr.length;
    labels.push(dia);
    vals.push(prom);
  });

  graficar(labels, vals, "Promedio últimos 30 días");
}

// Anual
async function cargarAnio(){

  clearInterval(realtimeInterval);

  const registros = await obtenerRegistros();

  if(registros.length === 0){
    alert("Sin datos anuales");
    return;
  }

  const porMes = {};

  registros.forEach(r => {
    const mes = new Date(r.epoch * 1000).toISOString().slice(0,7);
    if(!porMes[mes]) porMes[mes] = [];
    porMes[mes].push(r.temp);
  });

  let labels = [];
  let vals = [];

  Object.keys(porMes).sort().forEach(mes => {
    const arr = porMes[mes];
    const prom = arr.reduce((a,b)=>a+b,0) / arr.length;
    labels.push(mes);
    vals.push(prom);
  });

  graficar(labels, vals, "Promedio anual por mes");
}

// Exportar CSV
function exportarCSV(){

  if(ultimoDataset.length === 0){
    alert("Primero genera un gráfico");
    return;
  }

  let csv = "Tiempo,Temperatura\n";

  ultimoDataset.forEach(p => {
    csv += `${p.x},${p.y}\n`;
  });

  const blob = new Blob([csv], {type:"text/csv"});
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = "datos_temperatura_numec.csv";
  a.click();
}

modoTiempoReal();

</script>

</body>
</html>
